pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// Maven artifactId (published as net.gabriele333.gabrielequests:QuestsVisual:<version>).
// Defaults to the folder name (GabrieleQuests); overridden here so the rebrand to
// "Quests Visual" is reflected in the coordinate without renaming the project directory.
rootProject.name = 'QuestsVisual'
