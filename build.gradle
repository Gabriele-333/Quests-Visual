plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// Human-readable base name for the built/published jar (mod_id must be lowercase, but the
// display brand is "Quests Visual"): strip the spaces -> "QuestsVisual". Drives the jar
// filename (QuestsVisual-<mc>-<ver>.jar) and the archivesName used by other archive tasks.
def archivesBaseName = mod_name.replaceAll('\\s+', '')

repositories {
    mavenLocal()

    // Architectury API (required by all FTB mods)
    maven {
        url "https://maven.architectury.dev/"
        content {
            includeGroup "dev.architectury"
        }
    }

    // FTB mods (FTB Quests, FTB Library, FTB Teams, ...)
    maven {
        url "https://maven.ftb.dev/releases"
        content {
            includeGroup "dev.ftb.mods"
        }
    }

    // Mekanism (ModMaven mirror), dev runtime only - see the localRuntime deps below
    maven {
        url "https://modmaven.dev/"
        content {
            includeGroup "mekanism"
        }
    }

    // AE2 + GuideME + Ender IO + Draconic Evolution + Ars Nouveau (Modrinth maven),
    // dev runtime only (plus AE2/DE compileOnly, soft-deps behind ModList.isLoaded)
    maven {
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    // The Twilight Forest is not on Modrinth; cursemaven serves CurseForge files as
    // curse.maven:<slug>-<projectId>:<fileId>. Dev runtime only.
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = archivesBaseName
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // The structure baker (see dev/StructureBaker) needs a running integrated server,
            // because the structure registry is server-side data pack data. Point
            // GABRIELEQUESTS_BAKE_WORLD at a world folder under run/saves and the dev client
            // opens straight into it instead of stopping at the title screen.
            def bakeWorld = providers.environmentVariable('GABRIELEQUESTS_BAKE_WORLD')
            if (bakeWorld.isPresent()) {
                programArguments.addAll '--quickPlaySingleplayer', bakeWorld.get()
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// 'localRuntime' = present for dev-runtime testing but NOT pulled by dependents of this
// mod (it is not part of the published component). The display-multiblock test mods live
// here: none of them is a compile or published-runtime dependency.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // FTB Quests (NeoForge): the editor tools hook into it with mixins. Published with
    // Gradle module metadata, so Architectury, FTB Library and FTB Teams resolve
    // transitively and end up on the runtime classpath too -- and, because this is a
    // plain 'implementation' dependency, dependents of GabrieleQuests (e.g. FMTT2) inherit
    // FTB Quests transitively as well. runClient boots with the full FTB Quests stack.
    implementation "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}"

    // Mekanism (+ Generators), AE2 (+ GuideME), Ender IO (+ Athena), Draconic Evolution
    // (+ BrandonsCore, CodeChickenLib) and Ars Nouveau (+ GeckoLib, Curios) in the dev
    // runtime ONLY, to manually test the "display multiblock" feature. None is a hard
    // dependency: blocks are resolved by registry name and each type degrades to a
    // placeholder (and disappears from the menus) when its mod is absent.
    localRuntime "mekanism:Mekanism:${mekanism_version}"
    localRuntime "mekanism:Mekanism:${mekanism_version}:generators"
    localRuntime "maven.modrinth:ae2:${ae2_version}"
    localRuntime "maven.modrinth:guideme:${guideme_version}"
    localRuntime "maven.modrinth:enderio:${enderio_version}"
    localRuntime "maven.modrinth:athena-ctm:${athena_version}"
    localRuntime "maven.modrinth:draconic-evolution:${draconic_version}"
    localRuntime "maven.modrinth:brandons-core:${brandonscore_version}"
    localRuntime "maven.modrinth:codechicken-lib:${ccl_version}"
    localRuntime "maven.modrinth:ars-nouveau:${ars_nouveau_version}"
    localRuntime "maven.modrinth:geckolib:${geckolib_version}"
    localRuntime "maven.modrinth:curios:${curios_version}"
    localRuntime "maven.modrinth:pneumaticcraft-repressurized:${pneumaticcraft_version}"
    localRuntime "maven.modrinth:mystical-agriculture:${mystical_agriculture_version}"
    localRuntime "maven.modrinth:cucumber:${cucumber_version}"
    // The Twilight Forest: nothing here compiles against it - it is in the dev runtime
    // purely as a mod that ships a large catalogue of .nbt structure templates, which is
    // what the "display structure" feature reads (see StructureIndex).
    localRuntime "curse.maven:the-twilight-forest-227639:${twilightforest_file_id}"
    // The Gaia Dimension, same deal and the same reason: templates its own Java stitches
    // together, which client/structure/gaia ports. It has no dependencies and ships no
    // jar-in-jars, so it boots in the default dev runtime (the Aether does not - see below).
    localRuntime "curse.maven:gaia-dimension-302529:${gaiadimension_file_id}"
    // The Aether is the other shape of the same problem - it ships templates but no template
    // pools and no jigsaw blocks, so its dungeons only exist as its own Java, and the builders
    // in client/structure/aether are ports of that code. Nothing compiles against it, and it is
    // OPT-IN (-PwithAether): its jar-in-jar copy of Accessories carries a mixin
    // that targets a lambda by ordinal (lambda$createEntityRenderers$26), which resolves in a
    // production jar but not in the recompiled dev one, so FML kills the client at
    // RegisterRenderers. Nothing we can fix, and not worth breaking runClient for every other
    // feature - see the dependency notes in gradle.properties. owo-lib comes with it because that
    // Accessories build declares owo as required on NeoForge too.
    if (project.findProperty("withAether") != null) {
        localRuntime "maven.modrinth:aether:${aether_version}"
        localRuntime "maven.modrinth:owo-lib:${owo_lib_version}"
    }

    // AE2 also at compile time (compileOnly = still no hard dependency): the multiblock
    // renderer feeds AE2's formed crafting-cube/quantum-bridge models the connectivity
    // ModelData they normally get from block entities. appeng.* is only touched behind a
    // ModList.isLoaded("ae2") guard.
    compileOnly "maven.modrinth:ae2:${ae2_version}"

    // Draconic Evolution (+ its required deps) also compileOnly: the reactor / energy core
    // display is 100% BlockEntityRenderer, configured by the sandboxed BER phase behind
    // ModList.isLoaded guards - still no hard dependency.
    compileOnly "maven.modrinth:draconic-evolution:${draconic_version}"
    compileOnly "maven.modrinth:brandons-core:${brandonscore_version}"
    compileOnly "maven.modrinth:codechicken-lib:${ccl_version}"

    // NeoForge already bundles Mixin and MixinExtras (com.llamalad7.mixinextras.*) on the
    // compile + runtime classpath via the neoForge { version } block, so no extra mixin
    // dependency is required.
}

// This block of code expands all declared replace properties in the specified resource targets.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            ftb_quests_version_range: ftb_quests_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Publish to Maven Local (`gradlew publishToMavenLocal`) so packs can depend on it as
// net.gabriele333.gabrielequests:QuestsVisual:<version>. The artifactId is the project
// name (rootProject.name in settings.gradle); the group is mod_group_id.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.named('jar').configure {
    archiveBaseName = "${archivesBaseName}-${minecraft_version}"
    archiveVersion = "${mod_version}"
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
