mod_description=Reusable editor tools for FTB Quests: box selection, "Set shape" on a multi-selection, and display items / multiblocks / mannequins.

# FTB Quests (NeoForge) for Minecraft 1.21.1. Pulls FTB Library, FTB Teams and Architectury
# transitively via Gradle module metadata (so they load as mods at runtime, and dependents
# of this mod inherit FTB Quests transitively too).
# The dev runtime tracks the LATEST 2101.x build, because that is what broke: 2101.1.36
# extracted the inlined "grabbed.isMiddle()" box-selection tests out of QuestPanel
# .mouseReleased and QuestScreen.drawBackground into QuestPanel.isDraggingSelectionBox()
# (and gave FTB its own Alt + left-drag box selection), so two of our injectors matched
# nothing and FML killed the boot. The mixins now list both call sites, so .28 .. .35 keep
# working and the floor below stays where it is - bump this to whatever is newest when
# checking a report against the latest release.
ftb_quests_version=2101.1.36
# Accepted range of FTB Quests declared in the mod metadata (the 2101.x line == MC 1.21.1).
# Floor is 2101.1.28: that release reworked ChapterImage into a QuestObjectBase (getTitle()
# became final with getAltTitle() as the hook, images are created/edited as objects of their
# own instead of being re-serialised with their chapter) and dropped
# ChapterImageButton#openEditScreen, so our mixins no longer apply to earlier builds.
ftb_quests_version_range=[2101.1.28,)

# Dev-runtime-only mods (localRuntime): let runClient test the "display multiblock" feature.
# Not compile dependencies and not required at runtime (blocks resolved by registry name).
mekanism_version=1.21.1-10.7.19.85
ae2_version=19.2.17
guideme_version=21.1.16
enderio_version=v8.2.11-beta
# Athena (CTM lib): without it Ender IO capacitor bank models fail to load.
athena_version=4.0.6
# Draconic Evolution (+ BrandonsCore and CodeChickenLib, its required deps) for the
# reactor / energy core / fusion crafting display (also compileOnly, soft-dep).
draconic_version=3.1.4.632
brandonscore_version=3.2.1.309
ccl_version=4.6.1.526
# Ars Nouveau (+ GeckoLib and Curios, required in its toml) for the Enchanting Apparatus.
# GeckoLib uses the Modrinth VERSION ID (tPkJmim6 = 4.9.2 for 1.21.1 NeoForge): several
# releases share the number "4.9.2" and by number the maven resolves the wrong jar.
ars_nouveau_version=5.12.1
geckolib_version=tPkJmim6
curios_version=9.5.1+1.21.1
# PneumaticCraft: Repressurized for the Pressure Chamber / Refinery display (no hard deps).
pneumaticcraft_version=8.2.21
# Mystical Agriculture (+ Cucumber, its required dep) for the Infusion Altar display.
mystical_agriculture_version=8.0.27
cucumber_version=8.0.16
# The Twilight Forest, to test the "display structure" feature against a mod that ships a
# lot of .nbt templates (274: lich tower rooms, naga courtyard terraces, camps, ...). It is
# published on CurseForge only, hence cursemaven and a FILE ID rather than a version number
# (7797302 = 4.8.3345 for 1.21.1 NeoForge; it needs NeoForge >= 21.1.209 and no other mod).
twilightforest_file_id=7797302
# The Aether, to test the "display structure" feature against a mod that stitches its own
# templates together in Java (no template pools, no jigsaw blocks) - see client/structure/aether.
# Nitrogen and Cumulus, its two required libraries, are jar-in-jar inside this file.
aether_version=1.21.1-1.5.10-neoforge
# The Gaia Dimension, the third shape of the same problem as the Aether: 34 templates, no
# template pools AND no jigsaw blocks in the templates either, its two towers stacked by its own
# piece classes - see client/structure/gaia. CurseForge only, like the Twilight Forest, so a
# FILE ID again (7021516 = 2.2.288, the last 1.21.1 NeoForge build). No dependencies of its own
# and no jar-in-jars, so unlike the Aether it can just live in the default dev runtime.
gaiadimension_file_id=7021516
# owo-lib, for the Accessories build the Aether jar-in-jars: that beta declares owo as a hard
# dependency on NeoForge too, so without it FML refuses to load anything. NeoForge builds of
# owo-lib exist (the Fabric and NeoForge lines share the project, not the version numbers).
owo_lib_version=0.12.15.5-beta.1+1.21
